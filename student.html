<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sinh viên – NovaHA TalentHub</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">

    <header class="header">
      <a class="brand" href="/">⭠ Trở về</a>
      <h2>Sinh viên – Gửi hồ sơ</h2>
    </header>

    <main>
      <section class="card">
        <h3>Đăng ký hồ sơ sinh viên</h3>

        <form id="studentForm" enctype="multipart/form-data">

          <label class="small">Họ và tên</label>
          <input name="name" required>

          <label class="small">Email</label>
          <input name="email" type="email" required>

          <label class="small">Số điện thoại</label>
          <input name="phone">

          <label class="small">Trường</label>
          <input name="university">

          <label class="small">Kỹ năng</label>
          <input name="skills" placeholder="VD: HTML, CSS, JS">

          <label class="small">Giới thiệu</label>
          <textarea name="bio" rows="4"></textarea>

          <label class="small">Upload CV</label>
          <input type="file" name="cv" accept=".pdf,.doc,.docx">

          <button type="submit" class="btn-primary" style="margin-top:12px">Gửi hồ sơ</button>
        </form>

        <p id="msg" style="margin-top:12px"></p>
      </section>
    </main>

  </div>

<script src="/static/script.js"></script>

</body>
</html>
